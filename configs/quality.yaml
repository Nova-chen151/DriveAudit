evaluation:
  video:
    mode: input_gt
    dataset:
      history_frames: 10
      future_frames: 80
      cameras:
      - CAM_FRONT_LEFT
      - CAM_FRONT
      - CAM_FRONT_RIGHT
      - CAM_BACK_LEFT
      - CAM_BACK
      - CAM_BACK_RIGHT
    sampling:
      seed: 42
      camera_set: surround
      frames_per_scene: 50
      num_frames: 16
      clip_length: 16
      stride: 2
      source_fps: 12
      target_fps: 12
      max_clips_per_scene_camera: null
      max_multiview_frames: 80
      time_policy: native_order
      consistency_frames: 80
    metrics:
      epipolar:
        enabled: true
        thresholds_px:
        - 1
        - 3
        - 5
        bad_frame_threshold_px: 5.0
      loftr:
        enabled: true
        backend: kornia
        weights: outdoor
        weights_path: ${DRIVEAUDIT_METRIC_CACHE}/models/video/loftr/loftr_outdoor.ckpt
        allow_orb_fallback: false
        fallback_mark_low_confidence: false
        download_weights: false
        max_frames: 80
        camera_pairs:
        - - CAM_FRONT_LEFT
          - CAM_FRONT
        - - CAM_FRONT
          - CAM_FRONT_RIGHT
        - - CAM_BACK_LEFT
          - CAM_BACK
        - - CAM_BACK
          - CAM_BACK_RIGHT
    output:
      save_visualizations: false
      save_curves: false
      save_cache: false
      retention: metrics
    runtime:
      device: cuda
      num_workers: 0
      skip_heavy: false
      strict_heavy: true
      allow_fallback: false
    universal_protocol: true
    visual_quality:
      clipiqa:
        enabled: true
        batch_size: 4
      dino_temporal:
        enabled: true
        python: ${DRIVEAUDIT_DINO_PYTHON}
        source_dir: ${DRIVEAUDIT_DINO_SOURCE}
        weights_path: ${DRIVEAUDIT_METRIC_CACHE}/home/torch/hub/checkpoints/dinov2_vits14_pretrain.pth
        interval_seconds:
          short: 0.3
          medium: 1.0
          long: 2.5
        time_tolerance_s: 0.08
        batch_size: 8
        unique_exposures: true
        require_native_timestamps: true
  consistency:
    backends:
      mtpc:
        schema_version: mtpc-v1
        environment:
          python: ${DRIVEAUDIT_VISION_PYTHON}
        tracking:
          backend: opencv_lk_farneback_ransac
          formal_mode: fusion
          image_width: 400
          image_height: 224
          maximum_points: 24
          minimum_surviving_points: 3
          reseed_below_points: 8
          forward_backward_error_px: 2.5
          ransac_threshold_px: 3.0
          dense_flow_weight: 0.25
          minimum_appearance_similarity: 0.12
          maximum_lost_frames: 5
          reid_search_expansion: 2.0
          reid_template_threshold: 0.6
        projection:
          image_width: 400
          image_height: 224
          minimum_depth_m: 0.2
          minimum_projected_area_px: 64
          maximum_occlusion_ratio: 0.8
        future_entrants:
          enabled: true
          minimum_points: 3
          maximum_track_frames: 20
        gates:
          provisional_thresholds: true
          history_anchor:
            minimum_visible_samples: 20
            minimum_point_survival: 0.2
            maximum_center_error_px: 40.0
            minimum_identity_persistence: 0.2
          future_observability:
            minimum_expected_visible_agent_camera_frames: 100
            minimum_supported_agent_camera_frames: 20
          consistency:
            minimum_support_rate: 0.2
            maximum_normalized_center_error: 1.0
            minimum_box_iou: 0.02
            maximum_flow_epe_px: 25.0
            minimum_direction_agreement: -0.2
            minimum_identity_persistence: 0.15
            minimum_camera_support_recall: 0.2
        ablations:
          backend_modes:
          - box
          - point
          - mask
          - fusion
          history_lengths:
          - 1
          - 3
          - 5
          - 10
          view_sets:
            front_only:
            - CAM_FRONT
            front_three:
            - CAM_FRONT_LEFT
            - CAM_FRONT
            - CAM_FRONT_RIGHT
            all_six:
            - CAM_FRONT_LEFT
            - CAM_FRONT
            - CAM_FRONT_RIGHT
            - CAM_BACK_RIGHT
            - CAM_BACK
            - CAM_BACK_LEFT
        scorecard:
          provisional_total_score: false
        enabled: true
        dependencies:
        - numpy
        - scipy
        - cv2
        - shapely
        pairing: {}
    profile: core
