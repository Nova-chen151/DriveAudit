dataset:
  name: nuscenes300_challenger_v1
  version: v1.0-trainval
  dataroot: auto
  official_split_priority: [val, train]
  scene_count: 300
  seed: 20260730
paths:
  player_input_root: challenge/input-op/nuscenes300_challenger_v1
  gt_oracle_root: challenge/gt/nuscenes300_challenger_v1
  player_output_root: challenge/output
challenge:
  total_frames: 90
  history_frames: 10
  future_frames: 80
  reference_camera: CAM_FRONT
  camera_order: [CAM_FRONT_LEFT, CAM_FRONT, CAM_FRONT_RIGHT, CAM_BACK_RIGHT, CAM_BACK, CAM_BACK_LEFT]
  resolution: [400, 224]
timeline:
  max_camera_offset_ms: 60
  require_unique_sample_data: true
  require_monotonic_timestamps: true
  choose_best_90_frame_window: true
adversarial_selection:
  enabled: true
  protocol: challenger_inspired_single_adversarial_vehicle_v1
  ego_square_half_extent_m: 50
  max_interaction_distance_m: 35
  min_candidate_keyframes: 4
  min_visibility_token: 2
annotations:
  use_official_devkit_interpolation: true
  preserve_raw_category: true
  preserve_instance_token: true
  save_per_camera_native_boxes: false
  save_common_frame_tracks: true
  mark_interpolated_annotations: true
images:
  materialization_mode: hardlink
  keep_native: false
  create_challenge_resolution: true
  challenge_resolution_from_project_config: true
  allow_super_resolution: false
splits: {calibration: 180, validation: 60, test: 60, scene_level: true}
output:
  build_input: true
  build_gt_submission: true
  build_reference_gt: false
  oracle_self_reference: false
  atomic_write: true
evaluation:
  closed_loop: false
runtime: {resume: true, max_workers: auto, fail_scene_isolated: true, preserve_logs: true}
