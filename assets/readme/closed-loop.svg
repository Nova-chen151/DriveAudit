<svg xmlns="http://www.w3.org/2000/svg" width="960" height="304" viewBox="0 0 960 304" role="img" aria-labelledby="title desc">
  <title id="title">DriveAudit closed loop</title>
  <desc id="desc">Scene history initializes the renderer and traffic state. A driving policy plans from camera images. The executor advances the ego vehicle along the plan, and a traffic model updates surrounding actors. The renderer uses the updated state for the next round.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#475569"/>
    </marker>
  </defs>
  <rect x="1" y="1" width="958" height="302" rx="14" fill="#fff9eb" stroke="#cf921b" stroke-width="1.6"/>
  <g fill="none" stroke="#475569" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#arrow)">
    <path d="M 214 97 H 359"/>
    <path d="M 579 97 H 727"/>
    <path d="M 832 129 V 205"/>
    <path d="M 727 238 H 579"/>
    <path d="M 468 205 V 129"/>
    <path d="M 122 129 V 165 H 392 V 205"/>
    <path d="M 359 238 H 214" stroke-dasharray="5 4"/>
  </g>
  <g font-family="Arial, 'Noto Sans CJK SC', 'Microsoft YaHei', sans-serif">
    <text x="28" y="36" font-size="21" font-weight="700" fill="#604503">DriveAudit closed loop</text>
    <rect x="30" y="66" width="184" height="63" rx="10" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
    <text x="122" y="92" text-anchor="middle" font-size="17" font-weight="700" fill="#263449">Scene input</text>
    <text x="122" y="114" text-anchor="middle" font-size="14" fill="#374151">Map and scene history</text>
    <rect x="360" y="66" width="218" height="63" rx="10" fill="#edf4ff" stroke="#467dd4" stroke-width="1.5"/>
    <text x="469" y="92" text-anchor="middle" font-size="17" font-weight="700" fill="#204e90">Scene renderer</text>
    <text x="469" y="114" text-anchor="middle" font-size="14" fill="#374151">Calibrated cameras</text>
    <rect x="728" y="66" width="207" height="63" rx="10" fill="#eaf6ed" stroke="#469663" stroke-width="1.5"/>
    <text x="831.5" y="92" text-anchor="middle" font-size="17" font-weight="700" fill="#225c37">Driving policy</text>
    <text x="831.5" y="114" text-anchor="middle" font-size="14" fill="#374151">Plan ego motion</text>
    <rect x="728" y="206" width="207" height="63" rx="10" fill="#f2edfa" stroke="#8a65ba" stroke-width="1.5"/>
    <text x="831.5" y="232" text-anchor="middle" font-size="17" font-weight="700" fill="#5b3d85">Ego execution</text>
    <text x="831.5" y="254" text-anchor="middle" font-size="14" fill="#374151">Execute a plan segment</text>
    <rect x="360" y="206" width="218" height="63" rx="10" fill="#e8f6f5" stroke="#49978e" stroke-width="1.5"/>
    <text x="469" y="232" text-anchor="middle" font-size="17" font-weight="700" fill="#285e59">Traffic model</text>
    <text x="469" y="254" text-anchor="middle" font-size="14" fill="#374151">Update traffic history</text>
    <rect x="30" y="206" width="184" height="63" rx="10" fill="#ffffff" stroke="#ba8b39" stroke-width="1.5"/>
    <text x="122" y="232" text-anchor="middle" font-size="17" font-weight="700" fill="#674912">Trace verification</text>
    <text x="122" y="254" text-anchor="middle" font-size="14" fill="#374151">After the run</text>
    <text x="287" y="87" text-anchor="middle" font-size="14" fill="#334155">scene context</text>
    <text x="652" y="87" text-anchor="middle" font-size="14" fill="#334155">camera images</text>
    <text x="818" y="172" text-anchor="end" font-size="14" fill="#334155">planned trajectory</text>
    <text x="653" y="228" text-anchor="middle" font-size="14" fill="#334155">executed ego path</text>
    <text x="480" y="172" text-anchor="start" font-size="14" fill="#334155">ego pose + actors</text>
    <text x="258" y="155" text-anchor="middle" font-size="14" fill="#334155">initial traffic</text>
    <text x="287" y="228" text-anchor="middle" font-size="14" fill="#334155">step records</text>
    <text x="480" y="291" text-anchor="middle" font-size="14" fill="#604503">The next observation reflects both the executed ego motion and the updated traffic.</text>
  </g>
</svg>
