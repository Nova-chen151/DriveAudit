[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "driveaudit"
version = "0.1.0"
description = "Participant-conditioned traffic, surround-view rendering, driving policies, and paired evaluation"
requires-python = ">=3.9"

[project.optional-dependencies]
evaluation = ["numpy", "scipy", "shapely", "PyYAML", "Pillow"]

[project.scripts]
driveaudit = "driveaudit.__main__:main"

[tool.setuptools.packages.find]
include = ["driveaudit*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.package-data]
"driveaudit.generation" = ["bundles/*.json"]
